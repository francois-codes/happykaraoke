name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native SQLite for Electron
        run: npm run install:deps:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
