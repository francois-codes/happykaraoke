name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: release
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Python setuptools for node-gyp
        run: python3 -m pip install setuptools --break-system-packages || pip3 install setuptools

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native SQLite for Electron
        run: npm run install:deps:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Semantic Release (version, build DMG, and publish GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx semantic-release
